<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/Favicon_blue_32x32.png" />
    <meta
      name="description"
      content="Samsari hjelper virksomheter å få mer verdi ut av Microsoft 365 med Power Platform, automatisering og AI."
    />
    <title>Effektiviserings partner Samsari</title>
    <meta property="og:site_name" content="Samsari" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://samsari.no/samsari-logo-dark.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="index, follow" />
    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Samsari",
        "url": "https://samsari.no",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://samsari.no/blog?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      },
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Samsari",
        "url": "https://samsari.no",
        "logo": "https://samsari.no/samsari-logo-dark.png",
        "description": "Samsari hjelper virksomheter å automatisere arbeidsprosesser og få mer verdi ut av Microsoft 365 og Power Platform.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Hagbart Brinchmanns vei 20",
          "postalCode": "6510",
          "addressLocality": "Kristiansund",
          "addressCountry": "NO"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "hei@samsari.no",
          "contactType": "customer service"
        },
        "sameAs": [
          "https://www.linkedin.com/company/106360744/",
          "https://www.instagram.com/samsari_no/",
          "https://www.facebook.com/profile.php?id=61587026797848"
        ]
      }
    ]
    </script>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('samsari-theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          console.warn('Theme preload failed', error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
